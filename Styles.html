<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1f2937;--mute:#6b7280;--line:#e5e7eb;--brand:#0f4c81;--brand2:#1d6fb8;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--radius:10px}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--ink:#e5e7eb;--mute:#94a3b8;--line:#334155;--brand:#60a5fa;--brand2:#3b82f6;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.narrow{max-width:760px}
header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px}
header.top h1{font-size:17px;margin:0;color:var(--brand);flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:16px 0 8px}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
label .req{color:var(--bad)}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand2);outline-offset:0}
input.bad,select.bad,textarea.bad{border-color:var(--bad)}
.err{color:var(--bad);font-size:12.5px;margin-top:3px;min-height:0}
.hint{color:var(--mute);font-size:12px;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 16px}
.btn{display:inline-block;border:1px solid var(--brand);background:var(--brand);color:#fff;padding:9px 16px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.ok{background:var(--ok);border-color:var(--ok)}.btn.danger{background:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.end{justify-content:flex-end}.grow{flex:1}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--line);color:var(--ink)}
.pill.PENDING{background:#fef3c7;color:#92400e}.pill.APPROVED{background:#dcfce7;color:#166534}
.pill.RETURNED{background:#fee2e2;color:#991b1b}.pill.INVITED{background:#e0e7ff;color:#3730a3}.pill.CANCELLED{background:#e5e7eb;color:#4b5563}
.notice{padding:10px 12px;border-radius:8px;margin:10px 0;background:#fffbeb;border:1px solid #fcd34d;color:#78350f}
.notice.bad{background:#fef2f2;border-color:#fca5a5;color:#7f1d1d}.notice.ok{background:#f0fdf4;border-color:#86efac;color:#14532d}
.steps{display:flex;gap:4px;margin-bottom:14px;overflow-x:auto}
.steps span{flex:1;min-width:70px;text-align:center;font-size:11.5px;padding:6px 4px;border-bottom:3px solid var(--line);color:var(--mute)}
.steps span.on{border-color:var(--brand2);color:var(--brand);font-weight:700}.steps span.done{border-color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--bg);font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--mute)}
tr.click:hover{background:var(--bg);cursor:pointer}
.tablewrap{overflow-x:auto}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;background:none;padding:9px 14px;font:inherit;font-weight:600;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent}
.tabs button.on{color:var(--brand);border-color:var(--brand2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.stat b{display:block;font-size:22px}.stat span{color:var(--mute);font-size:12px}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20;justify-content:flex-end}
.drawer.open{display:flex}
.drawer .panel{background:var(--bg);width:min(760px,100%);height:100%;overflow-y:auto;padding:16px}
.filelink{display:inline-flex;gap:6px;align-items:center;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);margin:3px 6px 3px 0;cursor:pointer;font-size:13px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:8px;z-index:50;max-width:90%}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
.center{text-align:center}.mute{color:var(--mute)}.hide{display:none!important}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:14px}.kv dt{color:var(--mute)}.kv dd{margin:0;word-break:break-word}
@media (max-width:600px){.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}}
@media print{header.top,.btn,.tabs{display:none!important}body{background:#fff;color:#000}}
</style>
