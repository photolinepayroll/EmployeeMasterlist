<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<?!= include('Styles') ?>
</head>
<body>
<div class="wrap narrow" style="margin-top:6vh">
  <div class="card">
    <h2><?= appName ?> — Staff Login</h2>
    <p class="mute">For HR, Payroll, Accounting and Audit staff. New hires should use the personal link emailed by HR.</p>

    <div id="s1">
      <label for="email">Registered work email</label>
      <input id="email" type="email" autocomplete="email" placeholder="name@company.com">
      <div class="err" id="e1"></div>
      <p><button class="btn" id="send">Send login code</button></p>
    </div>

    <div id="s2" class="hide">
      <div class="notice ok">If your email is registered, a 6-digit code was sent. It expires in 10 minutes.</div>
      <label for="code">6-digit code</label>
      <input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="123456">
      <div class="err" id="e2"></div>
      <div class="row" style="margin-top:12px">
        <button class="btn" id="verify">Log in</button>
        <button class="btn ghost" id="back">Use another email</button>
      </div>
    </div>
  </div>
</div>
<script>window.__BASE__ = <?!= JSON.stringify(baseUrl) ?>;</script>
<?!= include('Client') ?>
<script>
(function () {
  let email = '';
  $('#send').onclick = function () {
    email = $('#email').value.trim();
    $('#e1').textContent = '';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { $('#e1').textContent = 'Enter a valid email.'; return; }
    const b = $('#send'); busy(b, true, 'Sending…');
    call('requestLoginCode', email).then(function () {
      $('#s1').classList.add('hide'); $('#s2').classList.remove('hide'); $('#code').focus();
    }).catch(function (e) { $('#e1').textContent = e.message; }).then(function () { busy(b, false); });
  };
  $('#verify').onclick = function () {
    const b = $('#verify'); $('#e2').textContent = ''; busy(b, true, 'Checking…');
    call('verifyLoginCode', email, $('#code').value).then(function (r) {
      Session.set(r.token, r.role, r.email);
      goTo(r.home);
    }).catch(function (e) { $('#e2').textContent = e.message; busy(b, false); });
  };
  $('#back').onclick = function () { $('#s2').classList.add('hide'); $('#s1').classList.remove('hide'); $('#code').value = ''; };
  $('#email').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#send').click(); });
  $('#code').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#verify').click(); });
})();
</script>
</body>
</html>
