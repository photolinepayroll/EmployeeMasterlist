<script>
/* Shared browser helpers. Validation here is for convenience only; the server re-validates everything. */
const $ = function (s, r) { return (r || document).querySelector(s); };
const $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/** Promise wrapper around google.script.run. Parses VALIDATION and SESSION errors. */
function call(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(function (e) {
        let msg = String((e && e.message) || e || 'Something went wrong.').replace(/^Error:\s*/, '');
        const err = new Error(msg);
        const i = msg.indexOf('VALIDATION:');
        if (i >= 0) {
          try { err.fields = JSON.parse(msg.slice(i + 11)); err.message = 'Please fix the highlighted fields.'; } catch (x) { /* keep raw */ }
        }
        if (msg.indexOf('SESSION:') >= 0) { err.session = true; err.message = msg.replace('SESSION:', '').trim(); }
        reject(err);
      })[fn].apply(null, args);
  });
}

const Session = {
  get token() { try { return sessionStorage.getItem('mlt') || ''; } catch (e) { return ''; } },
  get role() { try { return sessionStorage.getItem('mlr') || ''; } catch (e) { return ''; } },
  get email() { try { return sessionStorage.getItem('mle') || ''; } catch (e) { return ''; } },
  set: function (t, r, e) { try { sessionStorage.setItem('mlt', t); sessionStorage.setItem('mlr', r); sessionStorage.setItem('mle', e); } catch (x) { /* storage blocked */ } },
  clear: function () { try { sessionStorage.clear(); } catch (e) { /* ignore */ } }
};

function goTo(page) {
  // Apps Script serves pages in a sandboxed iframe; a target=_top link is the supported way to navigate.
  const a = document.createElement('a');
  a.href = (window.__BASE__ || '') + '?page=' + page;
  a.target = '_top';
  document.body.appendChild(a);
  a.click();
}

/** Call a protected function with the session token; bounce to login when the session is gone. */
function secure(fn) {
  const args = [fn, Session.token].concat(Array.prototype.slice.call(arguments, 1));
  return call.apply(null, args).catch(function (e) {
    if (e.session) { Session.clear(); goTo('login'); }
    throw e;
  });
}

let toastTimer;
function toast(msg) {
  let t = $('#toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.style.display = 'none'; }, 3500);
}

function busy(btn, on, label) {
  if (!btn) return;
  if (on) { btn.dataset.l = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span> ' + (label || 'Working…'); }
  else { btn.disabled = false; btn.innerHTML = btn.dataset.l || btn.innerHTML; }
}

/* ---------- Form rendering from the server field spec ---------- */
function fieldHtml(f, value, lists, prefix) {
  const id = (prefix || 'f') + '_' + f.k;
  const opts = f.options || (f.list && lists[f.list]) || [];
  let ctl;
  value = value || '';
  if (f.type === 'select') {
    ctl = '<select id="' + id + '" data-k="' + f.k + '"><option value="">— Select —</option>' +
      opts.map(function (o) { return '<option' + (o === value ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>';
  } else if (f.type === 'textarea') {
    ctl = '<textarea id="' + id + '" data-k="' + f.k + '" rows="3" maxlength="' + (f.max || 300) + '">' + esc(value) + '</textarea>';
  } else {
    const t = f.type === 'date' ? 'date' : (f.type === 'email' ? 'email' : (f.type === 'tel' ? 'tel' : 'text'));
    const dl = f.datalist ? ' list="dl_' + f.k + '"' : '';
    ctl = '<input id="' + id + '" data-k="' + f.k + '" type="' + t + '" value="' + esc(value) + '"' +
      (f.max ? ' maxlength="' + f.max + '"' : '') + dl + ' autocomplete="off">' +
      (f.datalist ? '<datalist id="dl_' + f.k + '">' + opts.map(function (o) { return '<option value="' + esc(o) + '">'; }).join('') + '</datalist>' : '');
  }
  return '<div class="fld" data-wrap="' + f.k + '"><label for="' + id + '">' + esc(f.label) + (f.req ? ' <span class="req">*</span>' : '') + '</label>' +
    ctl + (f.hint ? '<div class="hint">' + esc(f.hint) + '</div>' : '') + '<div class="err" data-err="' + f.k + '"></div></div>';
}

function readFields(root, spec) {
  const o = {};
  spec.forEach(function (f) {
    if (f.type === 'file' || f.type === 'files') return;
    const el = $('[data-k="' + f.k + '"]', root);
    if (el) o[f.k] = el.value.trim();
  });
  return o;
}

function localAge(birth) {
  const b = birth.split('-').map(Number), n = new Date();
  let a = n.getFullYear() - b[0];
  if (n.getMonth() + 1 < b[1] || (n.getMonth() + 1 === b[1] && n.getDate() < b[2])) a--;
  return a;
}

function checkField(f, v, lists) {
  if (!v) return f.req ? f.label + ' is required.' : '';
  if (f.pattern && !new RegExp(f.pattern).test(v)) return f.label + ' format is invalid' + (f.hint ? ' (' + f.hint + ')' : '') + '.';
  if (f.type === 'date') {
    if (isNaN(Date.parse(v))) return f.label + ' is not a valid date.';
    if (f.adult && localAge(v) < 18) return 'Applicant must be at least 18 years old.';
    if (f.notFuture && v > new Date().toISOString().slice(0, 10)) return f.label + ' cannot be in the future.';
  }
  return '';
}

function showErrors(root, errors) {
  $$('[data-err]', root).forEach(function (e) { e.textContent = ''; });
  $$('.bad', root).forEach(function (e) { e.classList.remove('bad'); });
  let first = null;
  Object.keys(errors || {}).forEach(function (k) {
    const m = $('[data-err="' + k + '"]', root);
    if (m) { m.textContent = errors[k]; }
    const c = $('[data-k="' + k + '"]', root);
    if (c) { c.classList.add('bad'); if (!first) first = c; }
  });
  if (first) first.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function validateSpec(root, spec, lists) {
  const data = readFields(root, spec), errors = {};
  spec.forEach(function (f) {
    if (f.type === 'file' || f.type === 'files') return;
    const m = checkField(f, data[f.k], lists);
    if (m) errors[f.k] = m;
  });
  showErrors(root, errors);
  return { data: data, errors: errors, ok: !Object.keys(errors).length };
}

/* ---------- Files ---------- */
function readAsBase64(file) {
  return new Promise(function (res, rej) {
    const r = new FileReader();
    r.onload = function () { res(String(r.result).split(',')[1] || ''); };
    r.onerror = function () { rej(new Error('Could not read the file.')); };
    r.readAsDataURL(file);
  });
}

function downloadBlob(name, mime, content) {
  const blob = content instanceof Blob ? content : new Blob([content], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

function b64ToBlob(b64, mime) {
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

/** CSV with BOM so Excel opens UTF-8; account numbers forced to text with ="..." to keep leading zeros. */
function toCsv(headers, rows, textCols) {
  const q = function (v, i) {
    v = String(v == null ? '' : v);
    if (textCols && textCols.indexOf(i) >= 0 && v) return '"=""' + v.replace(/"/g, '""') + '"""';
    return '"' + v.replace(/"/g, '""') + '"';
  };
  const lines = [headers.map(function (h, i) { return q(h, -1); }).join(',')];
  rows.forEach(function (r) { lines.push(r.map(q).join(',')); });
  return '﻿' + lines.join('\r\n');
}

function stamp() { return new Date().toISOString().slice(0, 10); }

function requireLogin(roles) {
  if (!Session.token || (roles && roles.indexOf(Session.role) < 0)) { Session.clear(); goTo('login'); return false; }
  return true;
}

function doLogout() {
  call('logout', Session.token).catch(function () {}).then(function () { Session.clear(); goTo('login'); });
}
</script>
