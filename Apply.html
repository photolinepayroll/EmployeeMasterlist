<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<?!= include('Styles') ?>
</head>
<body>
<header class="top"><div class="wrap"><h1><?= appName ?> — Employee Information Form</h1></div></header>
<div class="wrap narrow">
  <div id="loading" class="card center"><span class="spin"></span> Loading your form…</div>
  <div id="fatal" class="card hide"></div>
  <div id="done" class="card hide center">
    <h2>Thank you!</h2>
    <p>Your information was submitted to HR for review. You may close this page. If HR needs corrections, you will receive an email with a new link.</p>
  </div>

  <div id="app" class="hide">
    <div id="returned" class="notice bad hide"></div>
    <div id="locked" class="notice hide">This form has been submitted and is under review. It can no longer be edited.</div>
    <div class="steps" id="steps"></div>
    <div class="card" id="panel"></div>
    <div class="row">
      <button class="btn ghost" id="prev">Back</button>
      <span class="grow"></span>
      <span class="mute" id="saved"></span>
      <button class="btn" id="next">Next</button>
    </div>
  </div>
</div>

<script>
window.__BASE__ = <?!= JSON.stringify(baseUrl) ?>;
const TOKEN = <?!= JSON.stringify(inviteToken) ?>;
</script>
<?!= include('Client') ?>
<script>
(function () {
  let S = null;          // server payload
  let step = 1;
  let data = {};         // current text values
  let files = {};        // MedicalFileId, NBIFileId, OtherDocs
  let consent = false;

  function fatal(msg) {
    $('#loading').classList.add('hide');
    const f = $('#fatal'); f.classList.remove('hide');
    f.innerHTML = '<h2>Unable to open the form</h2><p>' + esc(msg) + '</p>';
  }

  call('getApplicationByToken', TOKEN).then(function (r) {
    S = r; data = r.data; files = r.files; consent = r.consent;
    $('#loading').classList.add('hide'); $('#app').classList.remove('hide');
    if (r.remarks) { const b = $('#returned'); b.classList.remove('hide'); b.innerHTML = '<b>HR needs corrections:</b><br>' + esc(r.remarks); }
    if (!r.editable) { $('#locked').classList.remove('hide'); }
    render();
  }).catch(function (e) { fatal(e.message); });

  function specFor(n) { return S.spec.filter(function (f) { return f.step === n; }); }
  function textSpecAll() { return S.spec.filter(function (f) { return f.type !== 'file' && f.type !== 'files'; }); }

  function collect() {
    const sp = specFor(step).filter(function (f) { return f.type !== 'file' && f.type !== 'files'; });
    if (sp.length) Object.assign(data, readFields($('#panel'), sp));
  }

  function render() {
    $('#steps').innerHTML = S.steps.map(function (s, i) {
      return '<span class="' + (i + 1 === step ? 'on' : (i + 1 < step ? 'done' : '')) + '">' + (i + 1) + '. ' + esc(s) + '</span>';
    }).join('');
    const p = $('#panel');
    let h = '<h2>' + esc(S.steps[step - 1]) + '</h2>';
    if (step === 1 && S.invitedName) h = '<h2>' + esc(S.steps[0]) + '</h2><p class="mute">Invited as: ' + esc(S.invitedName) + '</p>';

    if (step === 7) {
      h += reviewHtml();
      h += '<div class="notice"><b>Data Privacy Notice (RA 10173).</b> ' + esc(S.company) + ' collects your personal and government ID information solely for employment, payroll, statutory contributions and legal compliance. It is stored securely and only authorized HR staff can view it in full; payroll staff see only your name and payroll account. By ticking below you consent to this processing.</div>' +
        '<label style="display:flex;gap:8px;font-weight:600"><input type="checkbox" id="consent" style="width:auto"' + (consent ? ' checked' : '') + '> I have read the notice and confirm that the information I provided is true and correct.</label>' +
        '<div class="err" data-err="consent"></div>';
    } else {
      h += '<div class="grid">';
      specFor(step).forEach(function (f) {
        if (f.type === 'file') h += fileFieldHtml(f);
        else if (f.type === 'files') h += otherDocsHtml(f);
        else h += fieldHtml(f, data[f.k], S.lists);
      });
      h += '</div>';
    }
    p.innerHTML = h;
    wireFiles();
    const ed = S.editable;
    $$('input,select,textarea', p).forEach(function (el) { if (el.id !== 'consent' || !ed) el.disabled = !ed; });
    $('#prev').classList.toggle('hide', step === 1);
    const last = step === S.steps.length;
    $('#next').textContent = last ? 'Submit to HR' : 'Next';
    $('#next').classList.toggle('hide', last && !ed);
    window.scrollTo(0, 0);
  }

  function fileFieldHtml(f) {
    const cur = files[f.k];
    return '<div class="fld" style="grid-column:1/-1"><label>' + esc(f.label) + (f.req ? ' <span class="req">*</span>' : '') + '</label>' +
      '<div id="cur_' + f.k + '">' + (cur ? '✔ ' + esc(cur.name) : '<span class="mute">No file uploaded yet</span>') + '</div>' +
      (S.editable ? '<input type="file" data-up="' + f.k + '" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png">' : '') +
      '<div class="hint">PDF, JPG or PNG, max 5 MB.</div><div class="err" data-err="' + f.k + '"></div></div>';
  }

  function otherDocsHtml(f) {
    return '<div class="fld" style="grid-column:1/-1"><label>' + esc(f.label) + '</label>' +
      '<div id="docs">' + docsList() + '</div>' +
      (S.editable ? '<input type="file" data-up="OtherDocs" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png">' : '') +
      '<div class="hint">' + esc(f.hint || '') + ' PDF, JPG or PNG, max 5 MB each.</div><div class="err" data-err="OtherDocs"></div></div>';
  }

  function docsList() {
    if (!files.OtherDocs || !files.OtherDocs.length) return '<span class="mute">No documents uploaded</span>';
    return files.OtherDocs.map(function (d) {
      return '<span class="filelink">' + esc(d.name) + (S.editable ? ' <a href="#" data-rm="' + esc(d.id) + '" style="color:var(--bad)">✕</a>' : '') + '</span>';
    }).join('');
  }

  function wireFiles() {
    $$('[data-up]').forEach(function (inp) {
      inp.onchange = function () {
        const file = inp.files[0]; if (!file) return;
        const field = inp.dataset.up, errEl = $('[data-err="' + field + '"]');
        errEl.textContent = '';
        const okType = ['application/pdf', 'image/jpeg', 'image/png'].indexOf(file.type) >= 0;
        if (!okType) { errEl.textContent = 'Only PDF, JPG or PNG files are allowed.'; inp.value = ''; return; }
        if (file.size > S.limits.maxBytes) { errEl.textContent = 'File is larger than 5 MB.'; inp.value = ''; return; }
        inp.disabled = true; errEl.textContent = 'Uploading…';
        readAsBase64(file).then(function (b64) { return call('uploadFile', TOKEN, field, file.name, file.type, b64); })
          .then(function (r) {
            errEl.textContent = '';
            if (field === 'OtherDocs') { files.OtherDocs = r.docs; $('#docs').innerHTML = docsList(); wireFiles(); }
            else { files[field] = r.file; $('#cur_' + field).innerHTML = '✔ ' + esc(r.file.name); }
          }).catch(function (e) { errEl.textContent = e.message; })
          .then(function () { inp.disabled = false; inp.value = ''; });
      };
    });
    $$('[data-rm]').forEach(function (a) {
      a.onclick = function (ev) {
        ev.preventDefault();
        call('removeOtherDoc', TOKEN, a.dataset.rm).then(function (r) { files.OtherDocs = r.docs; $('#docs').innerHTML = docsList(); wireFiles(); })
          .catch(function (e) { toast(e.message); });
      };
    });
  }

  function reviewHtml() {
    let h = '<p class="mute">Please review your answers. Use Back to correct anything.</p><dl class="kv">';
    textSpecAll().forEach(function (f) { h += '<dt>' + esc(f.label) + '</dt><dd>' + esc(data[f.k] || '—') + '</dd>'; });
    h += '<dt>Medical scan</dt><dd>' + (files.MedicalFileId ? '✔ ' + esc(files.MedicalFileId.name) : '<b style="color:var(--bad)">Missing</b>') + '</dd>';
    h += '<dt>NBI scan</dt><dd>' + (files.NBIFileId ? '✔ ' + esc(files.NBIFileId.name) : '<b style="color:var(--bad)">Missing</b>') + '</dd>';
    h += '<dt>Other documents</dt><dd>' + ((files.OtherDocs || []).length || 'None') + '</dd></dl>';
    return h;
  }

  function saveDraftQuiet() {
    if (!S.editable) return Promise.resolve();
    $('#saved').textContent = 'Saving…';
    return call('saveDraft', TOKEN, data).then(function () { $('#saved').textContent = 'Draft saved'; })
      .catch(function () { $('#saved').textContent = ''; });
  }

  $('#prev').onclick = function () { collect(); step--; saveDraftQuiet(); render(); };

  $('#next').onclick = function () {
    const btn = $('#next');
    if (step < S.steps.length) {
      collect();
      if (S.editable) {
        const sp = specFor(step).filter(function (f) { return f.type !== 'file' && f.type !== 'files'; });
        const v = validateSpec($('#panel'), sp, S.lists);
        let fileMissing = false;
        specFor(step).forEach(function (f) {
          if (f.type === 'file' && f.req && !files[f.k]) { const e = $('[data-err="' + f.k + '"]'); if (e) e.textContent = f.label + ' is required.'; fileMissing = true; }
        });
        if (!v.ok || fileMissing) return;
      }
      step++; saveDraftQuiet(); render(); return;
    }
    // Final submit: validate everything again.
    consent = $('#consent').checked;
    if (!consent) { $('[data-err="consent"]').textContent = 'You must accept the Data Privacy notice.'; return; }
    busy(btn, true, 'Submitting…');
    call('submitApplication', TOKEN, data, consent).then(function () {
      $('#app').classList.add('hide'); $('#done').classList.remove('hide'); window.scrollTo(0, 0);
    }).catch(function (e) {
      busy(btn, false);
      if (e.fields) {
        // Jump to the first step that has an error.
        const keys = Object.keys(e.fields);
        const f = S.spec.find(function (x) { return keys.indexOf(x.k) >= 0; });
        if (f) { step = f.step; render(); showErrors($('#panel'), e.fields); }
        else if (e.fields.consent) { $('[data-err="consent"]').textContent = e.fields.consent; }
        toast('Please fix the highlighted fields.');
      } else { toast(e.message); }
    });
  };
})();
</script>
</body>
</html>
