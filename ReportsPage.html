<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<?!= include('Styles') ?>
</head>
<body>
<header class="top"><div class="wrap">
  <h1><?= appName ?> — Payroll Masterlist</h1>
  <span class="mute" id="who"></span>
  <a class="btn ghost sm hide" href="#" id="toAdmin">HR Admin</a>
  <button class="btn ghost sm" id="logout">Log out</button>
</div></header>

<div class="wrap">
  <div class="notice">Read-only, confidential. This list shows only Bio ID, Full Name, Account No. and Account Type. Do not share outside Payroll, Accounting and Audit.</div>
  <div class="card">
    <div class="row" style="margin-bottom:10px">
      <input id="q" placeholder="Search name, Bio ID, account no.…" style="max-width:320px">
      <select id="ftype" style="max-width:200px"><option value="">All account types</option><option>Payroll Savings</option><option>Other Bank</option></select>
      <span class="grow"></span>
      <span class="mute" id="count"></span>
      <button class="btn sm" id="csv">Download CSV</button>
      <button class="btn ghost sm" id="xlsx">Download Excel</button>
      <button class="btn ghost sm" onclick="window.print()">Print</button>
    </div>
    <div class="tablewrap"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div>
    <div class="mute center" id="empty" style="padding:14px">Loading…</div>
    <div class="hint" id="gen"></div>
  </div>
</div>

<script>window.__BASE__ = <?!= JSON.stringify(baseUrl) ?>;</script>
<?!= include('Client') ?>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function () {
  if (!requireLogin(['HR_ADMIN', 'PAYROLL', 'ACCOUNTING', 'AUDIT'])) return;
  $('#who').textContent = Session.email + ' (' + Session.role + ')';
  $('#logout').onclick = doLogout;
  if (Session.role === 'HR_ADMIN') { const a = $('#toAdmin'); a.classList.remove('hide'); a.onclick = function (e) { e.preventDefault(); goTo('admin'); }; }

  let D = null;
  secure('getLimitedMasterlist').then(function (d) {
    D = d;
    $('#head').innerHTML = '<tr><th>#</th>' + d.columns.map(function (c) { return '<th>' + esc(c.label) + '</th>'; }).join('') + '</tr>';
    $('#gen').textContent = 'Generated ' + d.generatedAt;
    draw();
  }).catch(function (e) { $('#empty').textContent = e.message; });

  function filtered() {
    const q = $('#q').value.toLowerCase(), t = $('#ftype').value;
    return D.rows.filter(function (r) {
      return (!t || r.AccountType === t) && (!q || (r.BioID + ' ' + r.FullName + ' ' + r.AccountNumber).toLowerCase().indexOf(q) >= 0);
    });
  }
  function draw() {
    const list = filtered();
    $('#rows').innerHTML = list.map(function (r, i) {
      return '<tr><td>' + (i + 1) + '</td>' + D.columns.map(function (c) { return '<td>' + esc(r[c.k]) + '</td>'; }).join('') + '</tr>';
    }).join('');
    $('#count').textContent = list.length + ' employee(s)';
    $('#empty').classList.toggle('hide', list.length > 0);
    $('#empty').textContent = 'No records.';
  }
  $('#q').oninput = draw; $('#ftype').onchange = draw;

  function matrix() { return filtered().map(function (r) { return D.columns.map(function (c) { return r[c.k]; }); }); }
  const heads = function () { return D.columns.map(function (c) { return c.label; }); };
  const acctIdx = function () { return D.columns.map(function (c) { return c.k; }).indexOf('AccountNumber'); };

  $('#csv').onclick = function () {
    if (!D) return;
    secure('logDownload', 'csv').catch(function () {});
    downloadBlob('Payroll_Masterlist_' + stamp() + '.csv', 'text/csv;charset=utf-8', toCsv(heads(), matrix(), [acctIdx(), 0]));
  };
  $('#xlsx').onclick = function () {
    if (!D) return;
    if (typeof XLSX === 'undefined') { toast('Excel library failed to load; use CSV.'); return; }
    secure('logDownload', 'xlsx').catch(function () {});
    const ws = XLSX.utils.aoa_to_sheet([heads()].concat(matrix().map(function (r) { return r.map(String); })));
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Masterlist');
    XLSX.writeFile(wb, 'Payroll_Masterlist_' + stamp() + '.xlsx');
  };
})();
</script>
</body>
</html>
